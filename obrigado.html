<!doctype html>
<html lang="pt-BR">
<head>

<meta name="robots" content="noindex">
<link rel="icon" href="assets/simbolo-neg.svg?v=2" type="image/svg+xml">
<style>
:root{--azul:#0B1C37;--off:#F4F2EE;--champ:#C6AF99;--suave:rgba(244,242,238,.72)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--azul);color:var(--off);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
main{max-width:520px;width:100%}
img{height:32px;margin-bottom:32px}
h1{font-size:clamp(26px,6vw,36px);font-weight:600;line-height:1.15}
.btn{display:block;margin:28px auto 0;background:#25D366;color:#0B1C37;font-weight:700;font-size:20px;padding:20px 24px;border-radius:999px;text-decoration:none}
#cont{margin-top:18px;font-size:17px;color:var(--champ);font-weight:600}
#parar{margin-top:10px;background:none;border:0;color:var(--suave);text-decoration:underline;font-size:14px;cursor:pointer}
.alt{margin-top:28px;font-size:14px;color:var(--suave)}

</style>
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

<body>
<main>
  <img src="assets/escola-neg.svg?v=2" alt="Escola de Motelaria" width="150" height="32">
  <h1><span id="oi">Você está</span> na lista. Falta só entrar no grupo da Black.</h1>
  <a class="btn" id="grupo" href="https://chat.whatsapp.com/EWumga16MSN0WlOhawDziF">Entrar no grupo da Black</a>
  <p id="cont" aria-live="polite">Redirecionando em 5…</p>
  <button id="parar" type="button">Ficar nesta página</button>
  <p class="alt">Prefere ver o conteúdo antes? <a href="app/">Entrar na área da Black</a></p>
</main>
<script>
(function(){
  // DESTINO: troque para 'app/' se a decisão for redirecionar para a plataforma.
  var DESTINO='https://chat.whatsapp.com/EWumga16MSN0WlOhawDziF';
  var q=new URLSearchParams(location.search), n=q.get('n');
  try{n=n||sessionStorage.getItem('bf_nome')}catch(e){}
  if(n){document.getElementById('oi').textContent=n+', você está'}
  var s=5, cont=document.getElementById('cont'), t;
  function vai(){try{if(window.fbq)fbq('trackCustom','EntrarGrupoBlack')}catch(e){} location.href=DESTINO}
  t=setInterval(function(){s--; if(s>0){cont.textContent='Redirecionando em '+s+'…'}else{clearInterval(t);cont.textContent='Abrindo o WhatsApp…';vai()}},1000);
  document.getElementById('grupo').addEventListener('click',function(){clearInterval(t)});
  document.getElementById('parar').addEventListener('click',function(){clearInterval(t);cont.textContent='Redirecionamento cancelado. Toque no botão quando quiser.';this.hidden=true});
})();
</script>
</body>
