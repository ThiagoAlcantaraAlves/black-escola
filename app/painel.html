<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#F4F2EE; --paper:#FFFFFF; --ink:#0B1C37; --ink2:#3C4659; --mute:#7D848E; --line:#E3DFD7; --soft:#ECE8E1;
  --navy:#0B1C37; --navy2:#13294F; --champ:#C6AF99; --champ2:#A98E73;
  --email:#2F6FED; --grupo:#1FA463; --individual:#0E8F8F; --instagram:#C13584; --ads:#E0552B; --area:#8A7A6A;
  --cap1:#C6AF99; --cap2:#2F6FED; --cap3:#C13584; --cap4:#0B1C37;
  --ok:#1FA463; --r:14px; --sh:0 1px 2px rgba(11,28,55,.06),0 8px 24px -12px rgba(11,28,55,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0B1220; --paper:#121B2E; --ink:#F4F2EE; --ink2:#C9CFDB; --mute:#8D95A3; --line:#243049; --soft:#1A2540;
  --navy:#0B1C37; --navy2:#13294F; --champ:#C6AF99; --champ2:#D9C7B2; --cap4:#C6AF99; --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0B1220; --paper:#121B2E; --ink:#F4F2EE; --ink2:#C9CFDB; --mute:#8D95A3; --line:#243049; --soft:#1A2540;
  --navy:#0B1C37; --navy2:#13294F; --champ:#C6AF99; --champ2:#D9C7B2; --cap4:#C6AF99; --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.jost{font-family:Jost,Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--email)}
mark{background:rgba(198,175,153,.35);color:inherit;border-radius:4px;padding:0 3px;font-weight:500}

/* ── Topo ── */
.topo{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 70%,#1B3566 100%);color:#F4F2EE;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 0}
.topo .in{max-width:1180px;margin:0 auto}
.topo .linha{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.volta{margin:0 0 14px;font-size:13px;color:rgba(244,242,238,.7)} .volta a{color:rgba(244,242,238,.85);text-decoration:none} .volta b{color:#C6AF99}
.topo h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.topo h1 small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--champ);font-weight:500;margin-bottom:6px}
.contagens{display:flex;gap:10px;flex-wrap:wrap}
.contagem{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;min-width:120px}
.contagem small{display:block;font-size:11px;color:rgba(244,242,238,.7);text-transform:uppercase;letter-spacing:.08em}
.contagem strong{font-family:Jost;font-size:22px;font-weight:600;color:#fff}
.contagem.alvo strong{color:var(--champ)}
.progresso{margin:18px 0 0;display:flex;align-items:center;gap:12px;font-size:13px;color:rgba(244,242,238,.8)}
.progresso .bar{flex:1;height:6px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.progresso .bar i{display:block;height:100%;background:var(--champ);border-radius:99px;transition:width .4s}

/* ── Abas ── */
.abas{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);padding:14px 20px 0;box-shadow:0 6px 16px -10px rgba(0,0,0,.5)}
.abas .in{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.abas .in::-webkit-scrollbar{display:none}
.aba{flex:0 0 auto;background:transparent;border:0;border-bottom:3px solid transparent;color:rgba(244,242,238,.65);padding:10px 14px 12px;display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap;border-radius:8px 8px 0 0}
.aba:hover{color:#fff;background:rgba(255,255,255,.05)}
.aba.on{color:#fff;border-bottom-color:var(--champ)}
.aba .dot{width:9px;height:9px;border-radius:50%;background:var(--c,#fff)}
.aba .n{font-size:11px;background:rgba(255,255,255,.12);border-radius:99px;padding:1px 7px;color:rgba(255,255,255,.85)}
.aba.on .n{background:var(--champ);color:var(--navy)}

/* ── Corpo ── */
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 16px}
.barra h2{margin:0 auto 0 0;font-size:20px;font-weight:600}
.barra p{margin:0;flex-basis:100%;color:var(--mute);font-size:13px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px}
.vazio{color:var(--mute);text-align:center;padding:40px 0}
.aviso{font-size:12px;color:var(--mute);margin:24px 0 0;text-align:center}
.aviso.erro{color:#B23B3B}

/* ── Calendário ── */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin:0 0 18px}
.dia{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 2px 5px;text-align:center;border-bottom-width:3px;position:relative;line-height:1.2}
.dia small{display:block;font-size:10px;color:var(--mute);text-transform:uppercase}
.dia b{font-family:Jost;font-size:17px;font-weight:600}
.dia .pts{display:flex;justify-content:center;gap:2px;margin-top:4px;height:5px}
.dia .pts i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dia .pts i.ok{background:var(--ok)}
.dia.marco b{color:var(--ads)}
.dia.hoje{outline:2px solid var(--champ);outline-offset:1px}
.dia.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dia.sel small{color:rgba(244,242,238,.7)}
.dia.sel b{color:var(--champ)}
.legenda{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mute);margin:-8px 0 18px}
.legenda i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* ── Grade de cards ── */
.grade{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:1000px){.grade{grid-template-columns:1fr 1fr}}
.grade .sep{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:10px 0 -4px;font-family:Jost;font-weight:600;font-size:15px}
.grade .sep::after{content:"";flex:1;height:1px;background:var(--line)}
.grade .sep .marco{font-family:Inter;font-weight:500;font-size:12px;color:var(--ads);background:rgba(224,85,43,.1);border-radius:99px;padding:2px 9px}
.grade .sep .cap{font-family:Inter;font-weight:500;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}

/* ── Card ── */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;position:relative;transition:opacity .2s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.card.email{--c:var(--email)} .card.grupo{--c:var(--grupo)} .card.individual{--c:var(--individual)} .card.instagram{--c:var(--instagram)} .card.ads{--c:var(--ads)} .card.area{--c:var(--area)}
.card.feito{opacity:.62}
.card.feito .corpo{display:none}
.card.feito .rodape .abrir{display:inline-flex}
.card .abrir{display:none}
.card .cab{display:flex;align-items:center;gap:12px;padding:14px 16px 10px 20px}
.quando{flex:0 0 auto;text-align:center;line-height:1;min-width:44px}
.quando b{display:block;font-family:Jost;font-size:24px;font-weight:600}
.quando small{display:block;font-size:10px;text-transform:uppercase;color:var(--mute);letter-spacing:.06em;margin-top:2px}
.meta{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12.5px;color:var(--ink2)}
.cod{font-family:Jost;font-weight:600;font-size:12px;letter-spacing:.04em;color:#fff;background:var(--c);border-radius:6px;padding:2px 7px}
.tipo{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);border-radius:6px;padding:1px 6px}
.hora{font-weight:600;color:var(--ink)}
.quem::before{content:"·";margin-right:8px;color:var(--mute)}
.chk{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--ok);margin:0}
.card.feito .chk{color:var(--ok);font-weight:600}
.card h3{margin:0;padding:0 16px 0 20px;font-size:17px;font-weight:600;line-height:1.3}
.card .previa{margin:4px 0 0;padding:0 16px 0 20px;color:var(--mute);font-style:italic;font-size:13.5px}
.corpo{padding:12px 16px 4px 20px}
.corpo p{margin:0 0 10px;overflow-wrap:anywhere}
.corpo .cta{display:inline-block;background:var(--navy);color:#F4F2EE;border-radius:8px;padding:7px 14px;font-weight:500;font-size:13px}
.corpo .cta small{display:block;font-weight:400;font-size:11px;opacity:.7;word-break:break-all}
.corpo .sub{font-family:Jost;font-weight:600;font-size:14px;margin:12px 0 4px;color:var(--c)}
.corpo .sub:first-child{margin-top:0}
.corpo .nota{display:block;color:var(--champ2);font-style:italic;background:rgba(198,175,153,.14);border-left:3px solid var(--champ);padding:6px 10px;border-radius:0 8px 8px 0}
.corpo .cena{padding-left:14px;border-left:2px solid var(--line);margin:0 0 6px}
.rodape{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 16px 14px 20px;border-top:1px dashed var(--line);margin-top:6px}
.rodape .para{flex:1;min-width:0;font-size:12px;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink);background:var(--soft)}
.btn.primario{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* e-mail: moldura de inbox */
.card.email .mail{margin:10px 16px 0 20px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 14px}
.card.email .mail .de{font-size:12px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.card.email .mail .de b{color:var(--ink)}
.card.email .mail h3{padding:0;margin:4px 0 0;font-size:16px}
.card.email .mail .previa{padding:0;margin:2px 0 0}

/* grupos: duas versões */
.versoes{display:grid;grid-template-columns:1fr;gap:10px;padding:10px 16px 0 20px}
@media (min-width:640px){.versoes{grid-template-columns:1fr 1fr}}
.versao{border-radius:10px;padding:10px 12px;background:var(--soft);font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.versao.a{background:rgba(31,164,99,.1)}
.versao .rot{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--grupo);margin-bottom:4px}
.versao.m .rot{color:var(--mute)}
.versao.vazia{color:var(--mute);font-style:italic}

/* individual: balão */
.balao{overflow-wrap:anywhere;margin:10px 16px 0 20px;background:#DCF8C6;color:#0B1C37;border-radius:12px 12px 12px 2px;padding:10px 14px;font-size:14px;position:relative;max-width:560px}
:root[data-theme="dark"] .balao{background:#1E3A2F;color:#F4F2EE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .balao{background:#1E3A2F;color:#F4F2EE}}
.balao p{margin:0 0 8px}.balao p:last-child{margin:0}
.balao::after{content:"";position:absolute;left:-7px;bottom:0;border:7px solid transparent;border-bottom-color:#DCF8C6;border-left:0}
:root[data-theme="dark"] .balao::after{border-bottom-color:#1E3A2F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .balao::after{border-bottom-color:#1E3A2F}}

/* instagram: formato */
.card.instagram .cab .tipo{background:rgba(193,53,132,.08)}
.ig-prev{display:flex;gap:12px;padding:10px 16px 0 20px;align-items:flex-start}
.ig-fmt{flex:0 0 auto;width:52px;padding:4px;text-align:center;border-radius:8px;background:linear-gradient(160deg,#C13584,#F56040);display:flex;align-items:center;justify-content:center;color:#fff;font-family:Jost;font-weight:700;font-size:10px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.ig-fmt.reels{height:78px}.ig-fmt.stories{height:78px;background:linear-gradient(160deg,#833AB4,#C13584)}.ig-fmt.carrossel{height:46px;background:linear-gradient(160deg,#F77737,#FCAF45)}.ig-fmt.gravar{height:46px;background:var(--ink2)}
.ig-prev .corpo{padding:0;flex:1;min-width:0}

/* produção */
.duas{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.duas{grid-template-columns:1fr 1fr}}
.bloco{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.bloco h3{margin:0 0 10px;font-size:17px}
.bloco p.sub{margin:-6px 0 12px;color:var(--mute);font-size:13px}
.lin{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.lin:first-of-type{border-top:0}
.lin input{width:18px;height:18px;accent-color:var(--ok);margin:2px 0 0;flex:0 0 auto}
.lin.feito label{text-decoration:line-through;color:var(--mute)}
.lin label{flex:1}
.lin .m{display:block;font-size:12px;color:var(--mute);margin-top:2px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>

  <p class="volta"><a href="/app/">← Jornada</a> · <a href="/app/equipe.html">Acompanhamento</a> · <a href="/app/painel.html"><b>Painel da campanha</b></a></p>

<script type="module">
import { supabase } from '/app/app.js';

// ───────── Dados do plano (doc 35) ─────────
const AREA = 'https://black.escolademotelaria.com.br/app/';
const PAG = 'https://black.escolademotelaria.com.br';
const CANAIS = {email:'E-mail', grupo:'Grupos WhatsApp', individual:'Mensagem individual', instagram:'Instagram', ads:'Meta Ads', area:'Área e operação'};
const CAP = (d) => d < '2026-11-09' ? 1 : d < '2026-11-16' ? 2 : d < '2026-11-22' ? 3 : 4;
const CAPNOME = {1:'Capítulo 1 · A conta de 2027', 2:'Capítulo 2 · O preço e o imposto', 3:'Capítulo 3 · A nova Escola', 4:'Capítulo 4 · A Black'};
const MARCOS = {'2026-11-05':'Abre: escala','2026-11-09':'Abre: preço e RevPAR','2026-11-12':'Abre: imposto · reunião','2026-11-16':'Abre: live · contador','2026-11-20':'Fecha Na frente 23h59','2026-11-22':'Link 15h e 17h','2026-11-23':'Live 17h','2026-11-27':'Black Friday','2026-11-29':'Fecha 23h59'};

const tipoIg = (t) => /^Stories/i.test(t) ? 'stories' : /^Carrossel/i.test(t) ? 'carrossel' : /^Gravar/i.test(t) ? 'gravar' : 'reels';
const E = (id, data, titulo, quem, assunto, previa, corpo, para='') => ({id, data, canal:'email', titulo, quem, assunto, previa, corpo, para, copy:`ASSUNTO: ${assunto}\nPRÉVIA: ${previa}\nDE: ${quem}\n\n${corpo}`});
const G = (id, data, titulo, a, m) => ({id, data, canal:'grupo', titulo, quem:'CRM / grupos', a, m, copy:a + (m ? `\n\n— Versão moteleiros —\n${m}` : '')});
const I = (id, data, titulo, quem, msg) => ({id, data, canal:'individual', titulo, quem, msg, copy:msg});
const R = (id, data, titulo, quem, roteiro) => ({id, data, canal:'instagram', titulo, quem, tipo:tipoIg(titulo), roteiro, copy:roteiro});
const A = (id, data, titulo, quem, briefing) => ({id, data, canal:'ads', titulo, quem, briefing, copy:briefing});
const X = (id, data, titulo, quem, nota) => ({id, data, canal:'area', titulo, quem, nota, copy:nota});

const ITENS = [
  X('x-video','2026-10-30','Vídeo da live na área, assistente ligado','Thiago','Vídeo "A conta de 2027" cadastrado na área (libera após o Raio-X). Assistente lendo a fila black_bot_fila (doc 34).'),
  E('e0','2026-10-30','E0 · A área da Black 2026 está aberta','Thiago Alcântara','A área da Black 2026 está aberta','O vídeo da conta de 2027 está lá dentro.',
`{nome}, ontem eu e o Vinicius fizemos a live sobre os desafios de 2027: o fim da escala 6x1, a reforma tributária e como a IA faz essas contas.

Para entrar, é o mesmo e-mail da inscrição. Chega um link de acesso na sua caixa.

[BOTÃO] Entrar na área da Black → ${AREA}

Quem ainda não está na lista entra por aqui: ${PAG}. O link da oferta chega para a lista no domingo 22/11, 24 horas antes de todo mundo.`,'Para: lista Black 2026 + Alunos + Moteleiros (com a exclusão evento-ja-aluno).'),
  G('g0','2026-10-30','G0 · A gravação está na área',
`A gravação da live de ontem está na área da Black 2026, junto com o Raio-X 2027 do seu motel. Entra com o mesmo e-mail da inscrição: ${AREA}`,
`A gravação da live de ontem sobre os desafios de 2027 está na área da Black 2026. Para ter acesso, é só entrar na lista: ${PAG}`),
  R('st0','2026-10-30','Stories · "a área da Black abriu"','Escola','Print da área com o vídeo. Texto: "A gravação da live de ontem já está na área da Black 2026. Lista na bio."'),
  R('r1g','2026-10-31','Gravar R1 (papel) e R2 (preço de sábado)','Vinicius',
`R1 · TEASER DO PAPEL (sem fala, 15 s)
Cena 1: passa um papel escrito CONFIDENCIAL.

// Código e nome a partir do título: "E1 · A conta..." → E1 / A conta...; "Postar R4 · o protocolo" → R4 / o protocolo
function codigo(it) {
  const t = it.titulo;
  let m = t.match(/^(?:Postar |Carrossel )?([A-Z]{1,2}\d{1,2}[a-z]?|G-com\d+)\s·\s(.+)$/i);
  if (m) return {cod:m[1].toUpperCase(), nome:m[2]};
  m = t.match(/^Stories(?: \d+h)?\s·\s(.+)$/i); if (m) return {cod:'', nome:m[1]};
  m = t.match(/^(Comunidade|Assistente|Acelerar|Prioridade|Pós-live|Ligações|Convite|Recuperação)[^·:]*[·:]\s*(.+)$/i); if (m) return {cod:'', nome:t};
  return {cod:'', nome:t};
}
// Hora, quando o título traz ("E9 · 9h · Hoje...") ou a nota traz ("Enviar às 15h")
function hora(it) { const m = it.titulo.match(/\b(\d{1,2}h(?:\d{2})?)\b/); return m ? m[1] : ''; }

// Texto corrido → HTML: parágrafos, botão, subtítulos (L1 · PROMESSA), cenas, notas entre colchetes, {variáveis} e links
function corpoHtml(txt) {
  const inline = (s) => esc(s)
    .replace(/\{(\w+)\}/g, '<mark>{$1}</mark>')
    .replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return txt.split(/\n\s*\n/).map((par) => {
    const linhas = par.split('\n');
    if (/^\[BOT[ÃA]O\]/i.test(linhas[0])) {
      const [, label, url] = linhas[0].match(/^\[BOT[ÃA]O\]\s*(.*?)(?:\s*→\s*(\S+))?$/i) || [];
      return `<p><span class="cta">${esc(label || 'Botão')}${url ? `<small>${esc(url)}</small>` : ''}</span></p>`;
    }
    if (/^\[.+\]$/s.test(par.trim()) && !/^\[BOT/i.test(par)) return `<p><em class="nota">${inline(par.trim().slice(1, -1))}</em></p>`;
    return '<p>' + linhas.map((l) => {
      if (/^(?:[LVR]\d+|VERSÃO [AM]|Capa|Última)\s*[·:]/.test(l)) return `<span class="sub">${inline(l)}</span>`;
      if (/^(?:Cena \d+|\d+\.)\s*[:.]?\s/.test(l)) return `<span class="cena">${inline(l)}</span>`;
      if (/^(?:Objetivo|Públicos|Alvo|Público|Legenda|Título|Texto|Campanha|Fila):/i.test(l)) { const [k, ...r] = l.split(':'); return `<b>${esc(k)}:</b>${inline(r.join(':'))}`; }
      return inline(l);
    }).join('<br>') + '</p>';
  }).join('');
}

function contagens() {

  $('#contagens').innerHTML = alvos.map(([n, d], i) => {
    const ms = new Date(d) - Date.now(); if (ms <= 0) return `<div class="contagem"><small>${n}</small><strong>passou</strong></div>`;
    const dias = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000);
    return `<div class="contagem ${i === 0 ? 'alvo' : ''}"><small>${n}</small><strong>${dias}d ${String(h).padStart(2, '0')}h</strong></div>`;
  }).join('');
}

  $('#progTxt').textContent = `${ok} de ${tot} peças feitas`;
  $('#progBar').style.width = Math.round(ok / tot * 100) + '%';
}
function abas() {
  $('#abas').innerHTML = ABAS.map(([k, n]) => {
    let tot = 0, ok = 0;
    if (CANAIS[k]) { const its = ITENS.filter((i) => i.canal === k); tot = its.length; ok = its.filter((i) => feito[i.id]).length; }
    else if (k === 'producao') { const arr = [...DECISOES, ...PRODUCAO]; tot = arr.length; ok = arr.filter((d) => feito[d.id]).length; }
    else { tot = ITENS.length; ok = ITENS.filter((i) => feito[i.id]).length; }
    return `<button class="aba ${aba === k ? 'on' : ''}" data-aba="${k}">${CANAIS[k] ? `<span class="dot" style="--c:var(--${k})"></span>` : ''}${n}<span class="n">${ok}/${tot}</span></button>`;
  }).join('');
  $('#abas').querySelectorAll('.aba').forEach((b) => (b.onclick = () => { aba = b.dataset.aba; subIg = null; render(); window.scrollTo({top:0, behavior:'smooth'}); }));
}

function barra(base) {
  const hoje = hojeISO();
  let h = '', sub = '';
  if (aba === 'agenda') { h = selDia ? ((selDia === hoje ? 'Hoje · ' : '') + fmtLongo(selDia)) : 'Todos os dias'; sub = selDia && MARCOS[selDia] ? MARCOS[selDia] + ' · ' : ''; sub += `${base.length} peça(s)` + (selDia ? '' : ' de 30/10 a 29/11. Clique num dia para ver só aquele dia.'); }
  else if (aba === 'producao') { h = 'Decisões e produção'; sub = 'O que ainda depende de alguém decidir, e os entregáveis com data.'; }
  else { h = CANAIS[aba]; sub = {email:'Cada e-mail com assunto, prévia e corpo prontos. {nome} vira a variável do Mailchimp.', grupo:'Versão A vai para alunos e MotelMind; versão M, só para o grupo dos moteleiros (quando existir).', individual:'Mensagens no pessoal: ligações da Prioridade, cutucadas do Acelerar e o assistente da fila.', instagram:'Reels, Stories e carrosséis com roteiro e legenda. Filtre pelo formato.', ads:'Campanhas de lista e de vendas, com público, orçamento e os criativos.', area:'Tarefas que abrem na área, conferências e a operação do dia.'}[aba]; sub += ` ${base.length} peça(s).`; }
  let chips = '';
  if (aba === 'instagram') chips += Object.entries(IGTIPOS).map(([k, n]) => `<button class="chip ${subIg === k ? 'on' : ''}" data-ig="${k}">${n}<span class="n">${ITENS.filter((i) => i.canal === 'instagram' && i.tipo === k).length}</span></button>`).join('');
  if (aba !== 'producao') chips += `<button class="chip ${soFalta ? 'on' : ''}" id="sofalta">Só o que falta</button>`;
  if (aba === 'agenda' && selDia) chips += `<button class="chip" id="tudo">Ver todos os dias</button>`;
  $('#barra').innerHTML = `<h2>${esc(h)}</h2>${chips}<p>${esc(sub)}</p>`;
  $('#barra').querySelectorAll('[data-ig]').forEach((b) => (b.onclick = () => { subIg = subIg === b.dataset.ig ? null : b.dataset.ig; render(); }));
  const sf = $('#sofalta'); if (sf) sf.onclick = () => { soFalta = !soFalta; render(); };
  const t = $('#tudo'); if (t) t.onclick = () => { selDia = null; render(); };
}

function calendario() {
  const hoje = hojeISO();

    const its = ITENS.filter((i) => i.data === d);

    return `<button class="dia ${d === hoje ? 'hoje' : ''} ${MARCOS[d] ? 'marco' : ''} ${selDia === d ? 'sel' : ''}" data-dia="${d}" title="${MARCOS[d] ? MARCOS[d] + ' · ' : ''}${its.length} peça(s)" style="border-bottom-color:var(--cap${CAP(d)})"><small>${semana(d)}</small><b>${d.slice(8)}</b><div class="pts">${pts}</div></button>`;
  }).join('');
  $('#cal').querySelectorAll('.dia').forEach((b) => (b.onclick = () => { selDia = selDia === b.dataset.dia ? null : b.dataset.dia; render(); }));
  $('#legenda').innerHTML = [1, 2, 3, 4].map((c) => `<span><i style="background:var(--cap${c})"></i>${CAPNOME[c]}</span>`).join('') + '<span><i style="background:var(--ok);width:6px;height:6px;border-radius:50%"></i>ponto verde = peça feita</span>';

    miolo = `<h3>${esc(nome)}</h3><div class="corpo">${corpoHtml(it.briefing)}</div>`;
  } else {
    miolo = `<h3>${esc(nome)}</h3><div class="corpo">${corpoHtml(it.nota)}</div>`;
  }
  const rod = `<div class="rodape"><span class="para">${esc(para)}</span><button class="btn abrir" data-abrir>Ver de novo</button><button class="btn primario" data-copiar>Copiar texto</button></div>`;
  return `<article class="card ${it.canal} ${f ? 'feito' : ''}" data-id="${it.id}">${cab}${miolo}${rod}</article>`;
}
function ligarCards(el) {
  el.querySelectorAll('.card input[type=checkbox]').forEach((c) => (c.onchange = () => marcar(c.closest('.card').dataset.id, c.checked)));
  el.querySelectorAll('[data-copiar]').forEach((b) => (b.onclick = async () => { const it = ITENS.find((i) => i.id === b.closest('.card').dataset.id); try { await navigator.clipboard.writeText(it.copy); toast('Copiado.'); } catch { toast('Não consegui copiar. Selecione o texto.'); } }));
  el.querySelectorAll('[data-abrir]').forEach((b) => (b.onclick = () => { const c = b.closest('.card'); c.classList.toggle('feito'); }));
}

function grade(base) {
  if (!base.length) { $('#grade').innerHTML = '<p class="vazio">Nada aqui com esse filtro.</p>'; return; }
  let html = '', ultimo = '', ultCap = 0;
  for (const it of base) {
    if (aba === 'agenda' && !selDia && it.data !== ultimo) {
      ultimo = it.data; const c = CAP(it.data);
      html += `<div class="sep">${fmtDia(it.data)}${MARCOS[it.data] ? `<span class="marco">${esc(MARCOS[it.data])}</span>` : ''}${c !== ultCap ? `<span class="cap">${CAPNOME[c]}</span>` : ''}</div>`; ultCap = c;
    } else if (aba !== 'agenda' && CAP(it.data) !== ultCap) {
      ultCap = CAP(it.data); html += `<div class="sep">${CAPNOME[ultCap]}</div>`;
    }
    html += card(it);
  }
  $('#grade').innerHTML = html;
  ligarCards($('#grade'));
}

function producao() {
  const bloco = (el, arr, comData) => {
    $(el).innerHTML = arr.map((d) => `<div class="lin ${feito[d.id] ? 'feito' : ''}" data-id="${d.id}"><input type="checkbox" id="chk-${d.id}" ${feito[d.id] ? 'checked' : ''} ${podeEscrever ? '' : 'disabled'}><label for="chk-${d.id}">${esc(d.t)}${comData ? `<span class="m">${esc(d.q)} · até ${fmtDia(d.d)}</span>` : ''}</label></div>`).join('');
    $(el).querySelectorAll('input[type=checkbox]').forEach((c) => (c.onchange = () => marcar(c.closest('.lin').dataset.id, c.checked)));
  };
  bloco('#decisoes', DECISOES, false);
  bloco('#prodLista', PRODUCAO, true);
}

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1600); }
function render() {
  progresso(); abas();
  const agenda = aba === 'agenda', prod = aba === 'producao';
  $('#cal').hidden = !agenda; $('#legenda').hidden = !agenda; $('#producao').hidden = !prod; $('#grade').hidden = prod;
  let base = ITENS.filter((i) => (agenda ? true : i.canal === aba) && (!soFalta || !feito[i.id]) && (!agenda || !selDia || i.data === selDia) && (aba !== 'instagram' || !subIg || i.tipo === subIg));
  barra(base);
  if (agenda) calendario();
  if (prod) producao(); else grade(base);
}


// ───────── Marcas compartilhadas (tabela black_painel_marcas, só admin) ─────────
const TAB = 'black_painel_marcas';
let modoLocal = false;
const LS = 'bf_painel_marcas';
function lerLocal() { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch { return {}; } }
async function carregarMarcas() {
  const { data, error } = await supabase.from(TAB).select('id,em,por');
  if (error) {
    modoLocal = true; feito = lerLocal(); render();
    $('#aviso').className = 'aviso erro';
    $('#aviso').textContent = error.code === '42P01' ? 'A tabela black_painel_marcas ainda não existe: rode a migration 0005. Até lá as marcas ficam só neste aparelho.' : 'Não consegui ler as marcas compartilhadas (' + (error.message || error.code) + '). Marcas só neste aparelho.';
    return;
  }
  modoLocal = false;
  feito = Object.fromEntries((data || []).map((m) => [m.id, { em: m.em, por: m.por }]));
  render();
  $('#aviso').className = 'aviso'; $('#aviso').textContent = 'Marcas compartilhadas com a equipe.';
}
async function marcar(id, ok) {
  const antes = feito[id];
  if (ok) feito[id] = { em: new Date().toISOString(), por: uid }; else delete feito[id];
  render();
  if (modoLocal) { try { localStorage.setItem(LS, JSON.stringify(feito)); } catch {} return; }
  const { error } = ok ? await supabase.from(TAB).upsert({ id, em: feito[id].em, por: uid }) : await supabase.from(TAB).delete().eq('id', id);
  if (error) {
    if (antes) feito[id] = antes; else delete feito[id];
    render();
    $('#aviso').className = 'aviso erro'; $('#aviso').textContent = 'Não consegui salvar a marca: ' + (error.message || error.code);
  }
}

// ───────── Início: só entra quem está logado e é da equipe ─────────
const { data: { user } } = await supabase.auth.getUser();
if (!user) { location.href = '/app/'; throw new Error('sem sessão'); }
uid = user.id;
const { data: papeis } = await supabase.from('user_roles').select('role').eq('user_id', user.id);
$('#main').hidden = false;
if (!(papeis || []).some((p) => p.role === 'admin')) {
  $('#gate').textContent = 'Acesso restrito à equipe da Escola. Se você é da equipe, peça para o Thiago liberar o seu e-mail.';
  document.querySelectorAll('#main > :not(#gate)').forEach((el) => (el.hidden = true));
  document.querySelector('.abas').hidden = true;
  throw new Error('sem papel');
}
const h = hojeISO();
selDia = DIAS.includes(h) ? h : null;
contagens(); setInterval(contagens, 60000);
render();
await carregarMarcas();
setInterval(() => { if (document.visibilityState === 'visible' && !modoLocal) carregarMarcas(); }, 45000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !modoLocal) carregarMarcas(); });
</script>
